[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-aa"
version = "0.1.0"
description = "Authorship attribution of pre-Islamic Arabic poetry (CAMeLBERT ensemble)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["aa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
